[package]
name = "hush"
version = "0.1.0"
edition = "2021"
[lib]
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup"] }
uuid = { version = "1.29.0", features = ["v4"] }
chrono = "0.4.45"
unicode-normalization = "0.1.26"
url = "2.5.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.11.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-wdio = { version = "1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
chrono-tz = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
keyring = { version = "3", features = ["apple-native"] }

rustix = { version = "1.1.6", features = ["fs"] }
zip = { version = "9.2.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27.0"

[dev-dependencies]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
